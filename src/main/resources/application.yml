server:
  port: ${PORT:8080}

spring:
  application:
    name: approval-workflow
  datasource:
    url: jdbc:h2:mem:workflowdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    defer-datasource-initialization: true
  sql:
    init:
      mode: always

app:
  jwt:
    secret: ${JWT_SECRET:workflow-engine-demo-secret-key-change-me-in-production-0123456789}
    expiration-ms: 3600000